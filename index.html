<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Objetiva Agro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root {
    --espresso: #1E3A2A;
    --bark: #6B5238;
    --parchment: #EEEBDD;
    --parchment-dark: #DCD6BE;
    --cherry: #A8442F;
    --leaf: #7A9B54;
    --caramel: #8A5A32;
    --card-bg: #FFFDF8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #DED2B8;
    font-family: 'Work Sans', sans-serif;
    color: var(--espresso);
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  #app {
    width: 100%;
    max-width: 480px;
    background: var(--parchment);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 16px 18px 10px;
    border-bottom: 1px solid var(--parchment-dark);
  }
  header .logo {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 16px;
  }
  header .farm {
    margin-left: auto;
    font-size: 11px;
    color: var(--bark);
    font-family: 'JetBrains Mono', monospace;
  }
  main { flex: 1; padding: 14px 16px 90px; overflow-y: auto; }
  h2 {
    font-family: 'Fraunces', serif;
    font-size: 20px;
    margin: 4px 0 14px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--parchment-dark);
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 10px;
  }
  .card .title { font-weight: 600; font-size: 14px; }
  .card .meta { font-size: 11px; color: var(--bark); margin-top: 2px; }
  .card .nota { font-size: 12.5px; margin-top: 6px; }
  .badge {
    display: inline-block;
    font-size: 10px;
    font-family: 'JetBrains Mono', monospace;
    padding: 2px 8px;
    border-radius: 999px;
    background: rgba(122,155,84,0.15);
    color: var(--leaf);
  }
  .badge.critico { background: rgba(168,68,47,0.12); color: var(--cherry); }
  form {
    background: var(--card-bg);
    border: 1px solid var(--parchment-dark);
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 18px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  label { font-size: 11px; color: var(--bark); font-family: 'JetBrains Mono', monospace; }
  input, select, textarea {
    font-family: 'Work Sans', sans-serif;
    font-size: 13.5px;
    padding: 9px 10px;
    border-radius: 10px;
    border: 1px solid var(--parchment-dark);
    background: var(--parchment);
    color: var(--espresso);
    width: 100%;
  }
  textarea { resize: vertical; min-height: 50px; }
  button {
    font-family: 'Work Sans', sans-serif;
    font-weight: 600;
    font-size: 13.5px;
    padding: 10px;
    border-radius: 12px;
    border: none;
    background: var(--espresso);
    color: var(--parchment);
    cursor: pointer;
    margin-top: 4px;
  }
  button:active { transform: scale(0.98); }
  nav {
    position: sticky;
    bottom: 0;
    background: var(--card-bg);
    border-top: 1px solid var(--parchment-dark);
    display: flex;
  }
  nav button.tab {
    flex: 1;
    background: transparent;
    color: var(--bark);
    font-size: 10.5px;
    font-weight: 400;
    border-radius: 0;
    padding: 10px 2px;
    margin: 0;
  }
  nav button.tab.active { color: var(--cherry); font-weight: 600; }
  .empty { text-align: center; color: var(--bark); font-size: 12.5px; padding: 24px 0; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .config-warning {
    background: #fff3cd;
    border: 1px solid #c99a2e;
    color: #6b4f10;
    padding: 12px;
    border-radius: 12px;
    font-size: 12.5px;
    margin: 14px;
  }
  .sig-canvas {
    border: 1px dashed var(--bark);
    border-radius: 10px;
    background: #fff;
    touch-action: none;
    width: 100%;
    height: 140px;
    display: block;
  }
  .btn-secundario {
    background: transparent;
    border: 1px solid var(--parchment-dark);
    color: var(--bark);
    margin-top: 4px;
  }
  .sig-preview {
    max-width: 120px;
    max-height: 50px;
    border: 1px solid var(--parchment-dark);
    border-radius: 6px;
    background: #fff;
    margin-top: 4px;
  }
  .grid-resumo {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }
  .stat-card {
    background: var(--card-bg);
    border: 1px solid var(--parchment-dark);
    border-radius: 16px;
    padding: 12px;
    text-align: center;
  }
  .stat-card .numero {
    font-family: 'Fraunces', serif;
    font-size: 24px;
    font-weight: 700;
    color: var(--espresso);
  }
  .stat-card .rotulo {
    font-size: 11px;
    color: var(--bark);
    margin-top: 2px;
  }
  .secao-titulo {
    font-family: 'Fraunces', serif;
    font-size: 14px;
    font-weight: 700;
    margin: 18px 0 8px;
    color: var(--espresso);
  }
  .alerta-card {
    background: rgba(168,68,47,0.08);
    border: 1px solid rgba(168,68,47,0.25);
    border-radius: 12px;
    padding: 10px 12px;
    margin-bottom: 8px;
    font-size: 12.5px;
  }
  .alerta-card .titulo { font-weight: 600; color: var(--cherry); }
  .timeline-item {
    border-left: 2px solid var(--leaf);
    padding: 4px 0 4px 12px;
    margin: 6px 0 6px 4px;
    font-size: 12.5px;
  }
  .timeline-item .etapa { font-weight: 600; color: var(--espresso); }
  .timeline-item .meta { font-size: 11px; color: var(--bark); }
  .link-botao {
    background: none;
    border: none;
    color: var(--cherry);
    font-weight: 600;
    font-size: 12.5px;
    padding: 4px 0;
    margin: 0;
    text-align: left;
  }
  .acoes-card {
    display: flex;
    gap: 16px;
    margin-top: 8px;
    border-top: 1px solid var(--parchment-dark);
    padding-top: 6px;
  }
  .acoes-card .btn-excluir { color: var(--cherry); }
  .acoes-card .btn-editar { color: var(--espresso); }
  .form-edicao {
    border: 2px solid var(--leaf) !important;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="logo">Objetiva Agro</span>
    <span class="farm">Sítio Jatobá</span>
  </header>
  <main id="main"></main>
  <nav id="nav"></nav>
</div>

<script>
/* =======================================================================
   CONFIGURAÇÃO — troque as duas linhas abaixo pelos dados do SEU projeto
   Onde encontrar: no Supabase, vá em "Project Settings" (ícone de
   engrenagem) > "API". Copie "Project URL" e a chave "anon public".
   ======================================================================= */
const SUPABASE_URL = "https://gxggowavxoicnxhayole.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_ZFePRJ--nXm1-doIeunEAw_yy2JnH4C";
/* ======================================================================= */

const configOk = !SUPABASE_URL.startsWith("COLE_AQUI") && !SUPABASE_ANON_KEY.startsWith("COLE_AQUI");
let sb = null;
let libError = null;
try {
  if (configOk) {
    if (!window.supabase) throw new Error("Biblioteca do Supabase não carregou (sem internet ou CDN bloqueado).");
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }
} catch (err) {
  libError = err.message;
}

const TABS = [
  { key: "inicio", label: "Início" },
  { key: "atividades", label: "Atividades" },
  { key: "estoque", label: "Estoque" },
  { key: "equipe", label: "Equipe" },
  { key: "maquinas", label: "Máquinas" },
  { key: "talhoes", label: "Talhões" },
  { key: "clima", label: "Clima" },
  { key: "seguranca", label: "Segurança" },
  { key: "rastreabilidade", label: "Rastreio" },
];

let state = { tab: "inicio", talhoes: [], funcionarios: [], pluviometros: [], epis: [], lotesCafe: [], loteExpandido: null, editando: null };

function fmtData(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" }) + " " +
         d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
}

// ---------- Helpers genéricos de editar/excluir ----------
function estaEditando(table, id) {
  return state.editando && state.editando.table === table && String(state.editando.id) === String(id);
}

function botoesAcao(table, id) {
  return `
    <div class="acoes-card">
      <button type="button" class="link-botao btn-editar" data-table="${table}" data-id="${id}">✏️ Editar</button>
      <button type="button" class="link-botao btn-excluir" data-table="${table}" data-id="${id}">🗑️ Excluir</button>
    </div>
  `;
}

function ativarBotoesAcao(container, msgExclusao) {
  container.querySelectorAll(".btn-editar").forEach(btn => {
    btn.onclick = () => {
      state.editando = { table: btn.dataset.table, id: btn.dataset.id };
      render();
    };
  });
  container.querySelectorAll(".btn-excluir").forEach(btn => {
    btn.onclick = async () => {
      if (!confirm(msgExclusao || "Excluir este registro? Essa ação não pode ser desfeita.")) return;
      await sb.from(btn.dataset.table).delete().eq("id", btn.dataset.id);
      render();
    };
  });
}

function ativarFormEdicaoGenerico(container) {
  container.querySelectorAll(".form-edicao").forEach(form => {
    const cancelar = form.querySelector(".btn-cancelar-edicao");
    if (cancelar) cancelar.onclick = () => { state.editando = null; render(); };
    form.onsubmit = async (e) => {
      e.preventDefault();
      const table = form.dataset.table;
      const id = form.dataset.id;
      const campos = JSON.parse(form.dataset.campos);
      const f = new FormData(form);
      const dados = {};
      campos.forEach(nome => {
        const v = f.get(nome);
        dados[nome] = (v === "" || v === null) ? null : v;
      });
      await sb.from(table).update(dados).eq("id", id);
      state.editando = null;
      render();
    };
  });
}

async function loadLookups() {
  if (!configOk) return;
  const { data: talhoes } = await sb.from("talhoes").select("*").order("nome");
  const { data: funcionarios } = await sb.from("funcionarios").select("*").order("nome");
  const { data: pluviometros } = await sb.from("pluviometros").select("*").order("nome");
  const { data: epis } = await sb.from("epis").select("*").order("nome");
  const { data: lotesCafe } = await sb.from("lotes_cafe").select("*, talhoes(nome)").order("criado_em", { ascending: false });
  state.talhoes = talhoes || [];
  state.funcionarios = funcionarios || [];
  state.pluviometros = pluviometros || [];
  state.epis = epis || [];
  state.lotesCafe = lotesCafe || [];
}

function renderNav() {
  const nav = document.getElementById("nav");
  nav.innerHTML = "";
  TABS.forEach(t => {
    const b = document.createElement("button");
    b.className = "tab" + (state.tab === t.key ? " active" : "");
    b.textContent = t.label;
    b.onclick = () => { state.tab = t.key; render(); };
    nav.appendChild(b);
  });
}

async function render() {
  renderNav();
  const main = document.getElementById("main");

  if (!configOk) {
    main.innerHTML = `<div class="config-warning">
      ⚠️ Falta configurar a conexão com o Supabase. Abra este arquivo, procure
      "CONFIGURACAO" no topo do código e cole a Project URL e a anon key do
      seu projeto (em Project Settings → API no Supabase).
    </div>`;
    return;
  }

  if (libError) {
    main.innerHTML = `<div class="config-warning">⚠️ ${libError}</div>`;
    return;
  }

  await loadLookups();

  if (state.tab === "inicio") return renderInicio(main);
  if (state.tab === "atividades") return renderAtividades(main);
  if (state.tab === "estoque") return renderEstoque(main);
  if (state.tab === "equipe") return renderEquipe(main);
  if (state.tab === "maquinas") return renderMaquinas(main);
  if (state.tab === "talhoes") return renderTalhoes(main);
  if (state.tab === "clima") return renderClima(main);
  if (state.tab === "seguranca") return renderSeguranca(main);
  if (state.tab === "rastreabilidade") return renderRastreabilidade(main);
}

// ---------- Talhões ----------
async function renderTalhoes(main) {
  main.innerHTML = `
    <h2>Talhões</h2>
    <form id="form-talhao">
      <label>Nome do talhão</label>
      <input name="nome" placeholder="Ex: Talhão 3" required />
      <label>Variedade</label>
      <input name="variedade" placeholder="Ex: Catuaí" />
      <div class="row2">
        <div>
          <label>Área (ha)</label>
          <input name="area_ha" type="number" step="0.1" placeholder="0.0" />
        </div>
        <div>
          <label>Idade (anos)</label>
          <input name="idade_anos" type="number" placeholder="0" />
        </div>
      </div>
      <button type="submit">Salvar talhão</button>
    </form>
    <div id="lista-talhoes"></div>
  `;
  document.getElementById("form-talhao").onsubmit = async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    await sb.from("talhoes").insert({
      nome: f.get("nome"),
      variedade: f.get("variedade") || null,
      area_ha: f.get("area_ha") || null,
      idade_anos: f.get("idade_anos") || null,
    });
    render();
  };
  const list = document.getElementById("lista-talhoes");
  if (!state.talhoes.length) { list.innerHTML = '<div class="empty">Nenhum talhão cadastrado ainda.</div>'; return; }
  const camposTalhao = ["nome", "variedade", "area_ha", "idade_anos"];
  list.innerHTML = state.talhoes.map(t => {
    if (estaEditando("talhoes", t.id)) {
      return `
        <form class="form-edicao" data-table="talhoes" data-id="${t.id}" data-campos='${JSON.stringify(camposTalhao)}'>
          <label>Nome do talhão</label>
          <input name="nome" value="${t.nome || ""}" required />
          <label>Variedade</label>
          <input name="variedade" value="${t.variedade || ""}" />
          <div class="row2">
            <div>
              <label>Área (ha)</label>
              <input name="area_ha" type="number" step="0.1" value="${t.area_ha ?? ""}" />
            </div>
            <div>
              <label>Idade (anos)</label>
              <input name="idade_anos" type="number" value="${t.idade_anos ?? ""}" />
            </div>
          </div>
          <div class="row2">
            <button type="submit">Salvar</button>
            <button type="button" class="btn-secundario btn-cancelar-edicao">Cancelar</button>
          </div>
        </form>
      `;
    }
    return `
    <div class="card">
      <div class="title">${t.nome}${t.variedade ? " · " + t.variedade : ""}</div>
      <div class="meta">${t.area_ha ? t.area_ha + "ha" : ""}${t.idade_anos ? " · " + t.idade_anos + " anos" : ""}</div>
      ${botoesAcao("talhoes", t.id)}
    </div>
  `;
  }).join("");
  ativarBotoesAcao(list, "Excluir este talhão? Isso pode afetar atividades e lotes ligados a ele.");
  ativarFormEdicaoGenerico(list);
}

// ---------- Atividades ----------
async function renderAtividades(main) {
  const { data: atividades } = await sb.from("atividades").select("*, talhoes(nome)").order("data_registro", { ascending: false }).limit(30);
  const talhaoOptions = state.talhoes.map(t => `<option value="${t.id}">${t.nome}</option>`).join("");
  main.innerHTML = `
    <h2>Atividades</h2>
    <form id="form-atividade">
      <label>Talhão</label>
      <select name="talhao_id" required>
        <option value="">Selecione...</option>
        ${talhaoOptions}
      </select>
      <label>Tipo de atividade</label>
      <select name="tipo" required>
        <option value="">Selecione...</option>
        <option>Poda</option><option>Adubação</option><option>Aplicação</option>
        <option>Colheita</option><option>Irrigação</option><option>Outro</option>
      </select>
      <label>Nota (texto do registro)</label>
      <textarea name="nota" placeholder="Ex: aplicamos herbicida, 20 litros"></textarea>
      <button type="submit">Registrar atividade</button>
    </form>
    <div id="lista-atividades"></div>
  `;
  document.getElementById("form-atividade").onsubmit = async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    if (!state.talhoes.length) { alert("Cadastre um talhão primeiro, na aba Talhões."); return; }
    await sb.from("atividades").insert({
      talhao_id: f.get("talhao_id"),
      tipo: f.get("tipo"),
      nota: f.get("nota") || null,
      modo_captura: "texto",
    });
    render();
  };
  const list = document.getElementById("lista-atividades");
  if (!atividades || !atividades.length) { list.innerHTML = '<div class="empty">Nenhuma atividade registrada ainda.</div>'; return; }
  const camposAtividade = ["talhao_id", "tipo", "nota"];
  const tiposAtividade = ["Poda", "Adubação", "Aplicação", "Colheita", "Irrigação", "Outro"];
  list.innerHTML = atividades.map(a => {
    if (estaEditando("atividades", a.id)) {
      return `
        <form class="form-edicao" data-table="atividades" data-id="${a.id}" data-campos='${JSON.stringify(camposAtividade)}'>
          <label>Talhão</label>
          <select name="talhao_id" required>
            ${state.talhoes.map(t => `<option value="${t.id}" ${t.id === a.talhao_id ? "selected" : ""}>${t.nome}</option>`).join("")}
          </select>
          <label>Tipo de atividade</label>
          <select name="tipo" required>
            ${tiposAtividade.map(tp => `<option ${tp === a.tipo ? "selected" : ""}>${tp}</option>`).join("")}
          </select>
          <label>Nota</label>
          <textarea name="nota">${a.nota || ""}</textarea>
          <div class="row2">
            <button type="submit">Salvar</button>
            <button type="button" class="btn-secundario btn-cancelar-edicao">Cancelar</button>
          </div>
        </form>
      `;
    }
    return `
    <div class="card">
      <div class="title">${a.tipo} — ${a.talhoes ? a.talhoes.nome : "talhão"}</div>
      ${a.nota ? `<div class="nota">${a.nota}</div>` : ""}
      <div class="meta">${fmtData(a.data_registro)}</div>
      ${botoesAcao("atividades", a.id)}
    </div>
  `;
  }).join("");
  ativarBotoesAcao(list, "Excluir esta atividade?");
  ativarFormEdicaoGenerico(list);
}

// ---------- Estoque ----------
async function renderEstoque(main) {
  const { data: itens } = await sb.from("itens_estoque").select("*").order("nome");
  main.innerHTML = `
    <h2>Estoque</h2>
    <form id="form-item">
      <label>Nome do item</label>
      <input name="nome" placeholder="Ex: Herbicida pós-emergente" required />
      <div class="row2">
        <div>
          <label>Categoria</label>
          <input name="categoria" placeholder="Ex: Defensivo" />
        </div>
        <div>
          <label>Unidade</label>
          <input name="unidade" placeholder="Ex: L, kg, un" />
        </div>
      </div>
      <div class="row2">
        <div>
          <label>Quantidade atual</label>
          <input name="quantidade" type="number" step="0.1" placeholder="0" />
        </div>
        <div>
          <label>Quantidade mínima</label>
          <input name="quantidade_minima" type="number" step="0.1" placeholder="0" />
        </div>
      </div>
      <button type="submit">Salvar item</button>
    </form>
    <div id="lista-estoque"></div>
  `;
  document.getElementById("form-item").onsubmit = async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    await sb.from("itens_estoque").insert({
      nome: f.get("nome"),
      categoria: f.get("categoria") || null,
      unidade: f.get("unidade") || null,
      quantidade: f.get("quantidade") || 0,
      quantidade_minima: f.get("quantidade_minima") || 0,
    });
    render();
  };
  const list = document.getElementById("lista-estoque");
  if (!itens || !itens.length) { list.innerHTML = '<div class="empty">Nenhum item no estoque ainda.</div>'; return; }
  const camposItem = ["nome", "categoria", "unidade", "quantidade", "quantidade_minima"];
  list.innerHTML = itens.map(i => {
    if (estaEditando("itens_estoque", i.id)) {
      return `
        <form class="form-edicao" data-table="itens_estoque" data-id="${i.id}" data-campos='${JSON.stringify(camposItem)}'>
          <label>Nome do item</label>
          <input name="nome" value="${i.nome || ""}" required />
          <div class="row2">
            <div>
              <label>Categoria</label>
              <input name="categoria" value="${i.categoria || ""}" />
            </div>
            <div>
              <label>Unidade</label>
              <input name="unidade" value="${i.unidade || ""}" />
            </div>
          </div>
          <div class="row2">
            <div>
              <label>Quantidade atual</label>
              <input name="quantidade" type="number" step="0.1" value="${i.quantidade ?? ""}" />
            </div>
            <div>
              <label>Quantidade mínima</label>

function fmtDataSimples(dataISO) {
  if (!dataISO) return "";
  const [ano, mes, dia] = dataISO.split("-");

}

async function renderSeguranca(main) {

      <input name="nome" placeholder="Ex: Luva de raspa" required />

    <form id="form-saida" style="margin-top:16px;">
      <label>Registrar entrega de EPI</label>
      <select name="funcionario_id" required>
        <option value="">Funcionário...</option>
        ${funcOptions}
      </select>
      <select name="epi_id" required>
        <option value="">EPI...</option>
        ${epiOptions}
      </select>
      <label>Quantidade</label>
      <input name="quantidade" type="number" step="1" value="1" required />
      <label>Assinatura do funcionário (recebimento)</label>
      <canvas id="sig-canvas" class="sig-canvas"></canvas>
      <button type="button" id="btn-limpar-assinatura" class="btn-secundario">Limpar assinatura</button>
      <button type="submit">Confirmar entrega</button>
    </form>

    <div id="lista-entregas"></div>
  `;

  document.getElementById("form-epi").onsubmit = async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    await sb.from("epis").insert({
      nome: f.get("nome"),
      ca_numero: f.get("ca_numero") || null,
      quantidade_atual: f.get("quantidade_atual") || 0,
      quantidade_minima: f.get("quantidade_minima") || 0,
    });
    render();
  };

  const list = document.getElementById("lista-epis");
  const camposEpi = ["nome", "ca_numero", "quantidade_atual", "quantidade_minima"];
  if (!state.epis.length) {
    list.innerHTML = '<div class="empty">Nenhum EPI cadastrado ainda.</div>';
  } else {
    list.innerHTML = state.epis.map(e => {
      if (estaEditando("epis", e.id)) {
        return `
          <form class="form-edicao" data-table="epis" data-id="${e.id}" data-campos='${JSON.stringify(camposEpi)}'>
            <label>Nome do EPI</label>
            <input name="nome" value="${e.nome || ""}" required />
            <input name="ca_numero" placeholder="Número do CA" value="${e.ca_numero || ""}" />
            <div class="row2">
              <div>
                <label>Quantidade atual</label>
                <input name="quantidade_atual" type="number" step="1" value="${e.quantidade_atual ?? ""}" />
              </div>
              <div>
                <label>Quantidade mínima</label>
                <input name="quantidade_minima" type="number" step="1" value="${e.quantidade_minima ?? ""}" />
              </div>
            </div>
            <div class="row2">
              <button type="submit">Salvar</button>
              <button type="button" class="btn-secundario btn-cancelar-edicao">Cancelar</button>
            </div>
          </form>
        `;
      }
      const critico = e.quantidade_minima && e.quantidade_atual <= e.quantidade_minima;
      return `
      <div class="card">
        <div class="title">${e.nome} ${critico ? '<span class="badge critico">repor</span>' : ""}</div>
        <div class="meta">${e.quantidade_atual ?? 0} un. · mínimo ${e.quantidade_minima ?? 0}${e.ca_numero ? " · CA " + e.ca_numero : ""}</div>
        ${botoesAcao("epis", e.id)}
      </div>`;
    }).join("");
    ativarBotoesAcao(list, "Excluir este EPI do cadastro?");
    ativarFormEdicaoGenerico(list);
  }

  // ---- Quadro de assinatura ----
  const canvas = document.getElementById("sig-canvas");
  const ctx = canvas.getContext("2d");
  function ajustarCanvas() {
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    ctx.strokeStyle = "#1E3A2A";
  }
  ajustarCanvas();
  let desenhando = false;
  let temAssinatura = false;

  function pos(e) {
    const rect = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - rect.left, y: t.clientY - rect.top };
  }
  function iniciar(e) {
    desenhando = true;
    temAssinatura = true;
    const p = pos(e);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    e.preventDefault();
  }
  function mover(e) {
    if (!desenhando) return;
    const p = pos(e);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    e.preventDefault();
  }
  function parar() { desenhando = false; }

  canvas.addEventListener("mousedown", iniciar);
  canvas.addEventListener("mousemove", mover);
  window.addEventListener("mouseup", parar);
  canvas.addEventListener("touchstart", iniciar);
  canvas.addEventListener("touchmove", mover);
  canvas.addEventListener("touchend", parar);

  document.getElementById("btn-limpar-assinatura").onclick = () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    temAssinatura = false;
  };

  document.getElementById("form-saida").onsubmit = async (e) => {
    e.preventDefault();
    if (!state.epis.length) { alert("Cadastre um EPI primeiro, no formulário acima."); return; }
    if (!state.funcionarios.length) { alert("Cadastre um funcionário primeiro, na aba Equipe."); return; }
    if (!temAssinatura) { alert("Peça para o funcionário assinar no quadro antes de confirmar."); return; }
    const f = new FormData(e.target);
    const assinaturaBase64 = canvas.toDataURL("image/png");
    const epiId = f.get("epi_id");
    const quantidade = Number(f.get("quantidade")) || 1;

    await sb.from("movimentos_epi").insert({
      epi_id: epiId,
      funcionario_id: f.get("funcionario_id"),
      quantidade: quantidade,
      assinatura: assinaturaBase64,
    });

    // Abate a quantidade entregue do estoque do EPI
    const epiAtual = state.epis.find(x => x.id === epiId);
    if (epiAtual) {
      const novaQtd = Math.max(0, Number(epiAtual.quantidade_atual || 0) - quantidade);
      await sb.from("epis").update({ quantidade_atual: novaQtd }).eq("id", epiId);
    }

    render();
  };

  const listaEntregas = document.getElementById("lista-entregas");
  if (!movimentos || !movimentos.length) {
    listaEntregas.innerHTML = '<div class="empty">Nenhuma entrega registrada ainda.</div>';
    return;
  }
  listaEntregas.innerHTML = movimentos.map(m => {
    if (estaEditando("movimentos_epi", m.id)) {
      return `
        <form class="form-edicao-entrega" data-id="${m.id}" data-epi-antigo="${m.epi_id}" data-qtd-antiga="${m.quantidade}">
          <label>Funcionário</label>
          <select name="funcionario_id" required>
            ${state.funcionarios.map(fu => `<option value="${fu.id}" ${fu.id === m.funcionario_id ? "selected" : ""}>${fu.nome}</option>`).join("")}
          </select>
          <label>EPI</label>
          <select name="epi_id" required>
            ${state.epis.map(e => `<option value="${e.id}" ${e.id === m.epi_id ? "selected" : ""}>${e.nome}</option>`).join("")}
          </select>
          <label>Quantidade</label>
          <input name="quantidade" type="number" step="1" value="${m.quantidade}" required />
          <div class="row2">
            <button type="submit">Salvar</button>
            <button type="button" class="btn-secundario btn-cancelar-edicao">Cancelar</button>
          </div>
        </form>
      `;
    }
    return `
    <div class="card">
      <div class="title">${m.epis ? m.epis.nome : "EPI"} — ${m.quantidade} un.</div>
      <div class="meta">${m.funcionarios ? m.funcionarios.nome : "funcionário"} · ${fmtData(m.data_entrega)}</div>
      ${m.assinatura ? `<img class="sig-preview" src="${m.assinatura}" alt="assinatura" />` : ""}
      ${botoesAcao("movimentos_epi", m.id)}
    </div>
  `;
  }).join("");

  listaEntregas.querySelectorAll(".btn-editar[data-table='movimentos_epi']").forEach(btn => {
    btn.onclick = () => { state.editando = { table: "movimentos_epi", id: btn.dataset.id }; render(); };
  });
  listaEntregas.querySelectorAll(".btn-excluir[data-table='movimentos_epi']").forEach(btn => {
    btn.onclick = async () => {
      if (!confirm("Excluir esta entrega? O estoque do EPI será devolvido automaticamente.")) return;
      const m = movimentos.find(x => x.id === btn.dataset.id);
      if (m) {
        const epiAtual = state.epis.find(x => x.id === m.epi_id);
        if (epiAtual) {
          const novaQtd = Number(epiAtual.quantidade_atual || 0) + Number(m.quantidade || 0);
          await sb.from("epis").update({ quantidade_atual: novaQtd }).eq("id", m.epi_id);
        }
      }
      await sb.from("movimentos_epi").delete().eq("id", btn.dataset.id);
      render();
    };
  });
  listaEntregas.querySelectorAll(".form-edicao-entrega").forEach(form => {
    const cancelar = form.querySelector(".btn-cancelar-edicao");
    if (cancelar) cancelar.onclick = () => { state.editando = null; render(); };
    form.onsubmit = async (e) => {
      e.preventDefault();
      const id = form.dataset.id;
      const epiAntigo = form.dataset.epiAntigo;
      const qtdAntiga = Number(form.dataset.qtdAntiga);
      const f = new FormData(form);
      const novoEpiId = f.get("epi_id");
      const novaQtd = Number(f.get("quantidade"));

      const epiAntigoObj = state.epis.find(x => x.id === epiAntigo);
      const estoqueAntigoRevertido = epiAntigoObj ? Number(epiAntigoObj.quantidade_atual || 0) + qtdAntiga : null;
      if (epiAntigoObj) {
        await sb.from("epis").update({ quantidade_atual: estoqueAntigoRevertido }).eq("id", epiAntigo);
      }

      let baseParaNovoEpi;
      if (novoEpiId === epiAntigo) {
        baseParaNovoEpi = estoqueAntigoRevertido;
      } else {
        const epiNovoObj = state.epis.find(x => x.id === novoEpiId);
        baseParaNovoEpi = epiNovoObj ? Number(epiNovoObj.quantidade_atual || 0) : 0;
      }
      const qtdFinal = Math.max(0, (baseParaNovoEpi || 0) - novaQtd);
      await sb.from("epis").update({ quantidade_atual: qtdFinal }).eq("id", novoEpiId);

      await sb.from("movimentos_epi").update({
        epi_id: novoEpiId,
        funcionario_id: f.get("funcionario_id"),
        quantidade: novaQtd,
      }).eq("id", id);

      state.editando = null;
      render();
    };
  });
}

// ---------- Início (resumo do dia) ----------
async function renderInicio(main) {
  const hoje = new Date();
  const inicioDoDia = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate()).toISOString();

  const { data: itensEstoque } = await sb.from("itens_estoque").select("*");
  const { data: atividadesHoje } = await sb.from("atividades")
    .select("*, talhoes(nome)")
    .gte("data_registro", inicioDoDia)
    .order("data_registro", { ascending: false });
  const { data: ultimaChuva } = await sb.from("leituras_chuva")
    .select("*, pluviometros(nome, propriedade)")
    .order("data_leitura", { ascending: false })
    .limit(1);

  const itensCriticos = (itensEstoque || []).filter(i => i.quantidade_minima && i.quantidade <= i.quantidade_minima);
  const episCriticos = (state.epis || []).filter(e => e.quantidade_minima && e.quantidade_atual <= e.quantidade_minima);
  const chuva = ultimaChuva && ultimaChuva[0];

  main.innerHTML = `
    <h2>Resumo — ${hoje.toLocaleDateString("pt-BR", { day: "2-digit", month: "long" })}</h2>

    <div class="grid-resumo">
      <div class="stat-card">
        <div class="numero">${state.talhoes.length}</div>
        <div class="rotulo">Talhões ativos</div>
      </div>
      <div class="stat-card">
        <div class="numero">${(itensEstoque || []).length}</div>
        <div class="rotulo">Itens em estoque</div>
      </div>
      <div class="stat-card">
        <div class="numero">${state.funcionarios.length}</div>
        <div class="rotulo">Colaboradores</div>
      </div>
      <div class="stat-card">
        <div class="numero">${(atividadesHoje || []).length}</div>
        <div class="rotulo">Atividades hoje</div>
      </div>
    </div>

    ${chuva ? `
      <div class="card">
        <div class="title">🌧️ Última chuva registrada: ${chuva.volume_mm ?? 0} mm</div>
        <div class="meta">${chuva.pluviometros ? chuva.pluviometros.nome : ""}${chuva.pluviometros && chuva.pluviometros.propriedade ? " · " + chuva.pluviometros.propriedade : ""} · ${fmtDataSimples(chuva.data_leitura)}</div>
      </div>
    ` : ""}

    ${(itensCriticos.length || episCriticos.length) ? `
      <div class="secao-titulo">Alertas</div>
      ${itensCriticos.map(i => `
        <div class="alerta-card">
          <span class="titulo">Estoque baixo:</span> ${i.nome} (${i.quantidade ?? 0}${i.unidade || ""} restante)
        </div>
      `).join("")}
      ${episCriticos.map(e => `
        <div class="alerta-card">
          <span class="titulo">EPI baixo:</span> ${e.nome} (${e.quantidade_atual ?? 0} un. restante)
        </div>
      `).join("")}
    ` : ""}

    <div class="secao-titulo">Atividades de hoje</div>
    ${(atividadesHoje && atividadesHoje.length) ? atividadesHoje.map(a => `
      <div class="card">
        <div class="title">${a.tipo} — ${a.talhoes ? a.talhoes.nome : "talhão"}</div>
        ${a.nota ? `<div class="nota">${a.nota}</div>` : ""}
        <div class="meta">${fmtData(a.data_registro)}</div>
      </div>
    `).join("") : '<div class="empty">Nenhuma atividade registrada hoje ainda.</div>'}
  `;
}

// ---------- Rastreabilidade do café ----------
const ETAPAS_LOTE = ["Colheita", "Processamento - Natural", "Processamento - Cereja Descascado", "Processamento - Lavado", "Secagem", "Armazenamento", "Venda/Saída", "Outro"];

async function renderRastreabilidade(main) {
  const talhaoOptions = state.talhoes.map(t => `<option value="${t.id}">${t.nome}</option>`).join("");
  const etapaOptions = ETAPAS_LOTE.map(e => `<option value="${e}">${e}</option>`).join("");

  let eventosDoLoteExpandido = [];
  if (state.loteExpandido) {
    const { data } = await sb.from("eventos_lote")
      .select("*")
      .eq("lote_id", state.loteExpandido)
      .order("data_evento", { ascending: true });
    eventosDoLoteExpandido = data || [];
  }

  main.innerHTML = `
    <h2>Rastreabilidade do Café</h2>

    <form id="form-lote">
      <label>Novo lote</label>
      <input name="codigo" placeholder="Ex: Lote-2026-01" required />
      <select name="talhao_id">
        <option value="">Talhão de origem (opcional)</option>
        ${talhaoOptions}
      </select>
      <label>Data da colheita</label>
      <input name="data_colheita" type="date" />
      <label>Observação (opcional)</label>
      <input name="observacao" placeholder="Ex: variedade, altitude..." />
      <button type="submit">Criar lote</button>
    </form>

    <div id="lista-lotes"></div>
  `;

  document.getElementById("form-lote").onsubmit = async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    await sb.from("lotes_cafe").insert({
      codigo: f.get("codigo"),
      talhao_id: f.get("talhao_id") || null,
      data_colheita: f.get("data_colheita") || null,
      observacao: f.get("observacao") || null,
    });
    render();
  };

  const list = document.getElementById("lista-lotes");
  if (!state.lotesCafe.length) {
    list.innerHTML = '<div class="empty">Nenhum lote de café cadastrado ainda.</div>';
    return;
  }

  list.innerHTML = state.lotesCafe.map(lote => {
    if (estaEditando("lotes_cafe", lote.id)) {
      const camposLote = ["codigo", "talhao_id", "data_colheita", "observacao"];
      return `
        <form class="form-edicao" data-table="lotes_cafe" data-id="${lote.id}" data-campos='${JSON.stringify(camposLote)}'>
          <label>Código</label>
          <input name="codigo" value="${lote.codigo || ""}" required />
          <select name="talhao_id">
            <option value="">Talhão de origem (opcional)</option>
            ${state.talhoes.map(t => `<option value="${t.id}" ${t.id === lote.talhao_id ? "selected" : ""}>${t.nome}</option>`).join("")}
          </select>
          <label>Data da colheita</label>
          <input name="data_colheita" type="date" value="${lote.data_colheita || ""}" />
          <input name="observacao" placeholder="Observação" value="${lote.observacao || ""}" />
          <div class="row2">
            <button type="submit">Salvar</button>
            <button type="button" class="btn-secundario btn-cancelar-edicao">Cancelar</button>
          </div>
        </form>
      `;
    }
    const expandido = state.loteExpandido === lote.id;
    return `
      <div class="card">
        <div class="title">${lote.codigo}</div>
        <div class="meta">${lote.talhoes ? lote.talhoes.nome + " · " : ""}${lote.data_colheita ? "colhido em " + fmtDataSimples(lote.data_colheita) : ""}</div>
        ${lote.observacao ? `<div class="nota">${lote.observacao}</div>` : ""}
        <button type="button" class="link-botao btn-expandir-lote" data-lote="${lote.id}">${expandido ? "▴ Fechar histórico" : "▾ Ver histórico / adicionar etapa"}</button>
        ${botoesAcao("lotes_cafe", lote.id)}
        ${expandido ? `
          <div id="timeline-${lote.id}">
            ${eventosDoLoteExpandido.length ? eventosDoLoteExpandido.map(ev => {
              if (estaEditando("eventos_lote", ev.id)) {
                const camposEvento = ["etapa", "data_evento", "peso_kg", "observacao"];
                return `
                  <form class="form-edicao" data-table="eventos_lote" data-id="${ev.id}" data-campos='${JSON.stringify(camposEvento)}'>
                    <select name="etapa" required>
                      ${ETAPAS_LOTE.map(et => `<option value="${et}" ${et === ev.etapa ? "selected" : ""}>${et}</option>`).join("")}
                    </select>
                    <div class="row2">
                      <div>
                        <label>Data</label>
                        <input name="data_evento" type="date" value="${ev.data_evento || ""}" required />
                      </div>
                      <div>
                        <label>Peso (kg)</label>
                        <input name="peso_kg" type="number" step="0.1" value="${ev.peso_kg ?? ""}" />
                      </div>
                    </div>
                    <input name="observacao" value="${ev.observacao || ""}" />
                    <div class="row2">
                      <button type="submit">Salvar</button>
                      <button type="button" class="btn-secundario btn-cancelar-edicao">Cancelar</button>
                    </div>
                  </form>
                `;
              }
              return `
              <div class="timeline-item">
                <div class="etapa">${ev.etapa}</div>
                <div class="meta">${fmtDataSimples(ev.data_evento)}${ev.peso_kg ? " · " + ev.peso_kg + " kg" : ""}</div>
                ${ev.observacao ? `<div class="nota">${ev.observacao}</div>` : ""}
                ${botoesAcao("eventos_lote", ev.id)}
              </div>
            `;
            }).join("") : '<div class="empty">Nenhuma etapa registrada ainda.</div>'}
          </div>
          <form class="form-evento" data-lote="${lote.id}" style="margin-top:8px;">
            <select name="etapa" required>
              <option value="">Etapa...</option>
              ${etapaOptions}
            </select>
            <div class="row2">
              <div>
                <label>Data</label>
                <input name="data_evento" type="date" required />
              </div>
              <div>
                <label>Peso (kg, opcional)</label>
                <input name="peso_kg" type="number" step="0.1" placeholder="0" />
              </div>
            </div>
            <input name="observacao" placeholder="Observação (opcional)" />
            <button type="submit">Adicionar etapa</button>
          </form>
        ` : ""}
      </div>
    `;
  }).join("");

  list.querySelectorAll(".btn-expandir-lote").forEach(btn => {
    btn.onclick = () => {
      const id = btn.getAttribute("data-lote");
      state.loteExpandido = (state.loteExpandido === id) ? null : id;
      render();
    };
  });

  ativarBotoesAcao(list, "Excluir este registro? Essa ação não pode ser desfeita.");
  ativarFormEdicaoGenerico(list);

  list.querySelectorAll(".form-evento").forEach(form => {
    const dataInput = form.querySelector('input[name="data_evento"]');
    if (dataInput) dataInput.value = new Date().toISOString().slice(0, 10);
    form.onsubmit = async (e) => {
      e.preventDefault();
      const loteId = form.getAttribute("data-lote");
      const f = new FormData(form);
      await sb.from("eventos_lote").insert({
        lote_id: loteId,
        etapa: f.get("etapa"),
        data_evento: f.get("data_evento"),
        peso_kg: f.get("peso_kg") || null,
        observacao: f.get("observacao") || null,
      });
      render();
    };
  });
}

render();
</script>
