<body>
<div id="app">
  <header>
    <span class="logo">Objetiva Agro</span>
    <span class="farm">Sítio Jatobá</span>
  </header>
  <main id="main"></main>
  <nav id="nav"></nav>
</div>
<div id="area-impressao"></div>

<script>
/* =======================================================================
   CONFIGURAÇÃO — troque as duas linhas abaixo pelos dados do SEU projeto
   Onde encontrar: no Supabase, vá em "Project Settings" (ícone de
   engrenagem) > "API". Copie "Project URL" e a chave "anon public".
   ======================================================================= */
const SUPABASE_URL = "https://gxggowavxoicnxhayole.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_ZFePRJ--nXm1-doIeunEAw_yy2JnH4C";
/* ======================================================================= */

const configOk = !SUPABASE_URL.startsWith("COLE_AQUI") && !SUPABASE_ANON_KEY.startsWith("COLE_AQUI");
let sb = null;
let libError = null;
try {
  if (configOk) {
    if (!window.supabase) throw new Error("Biblioteca do Supabase não carregou (sem internet ou CDN bloqueado).");
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }
} catch (err) {
  libError = err.message;
}

const TABS = [
  { key: "inicio", label: "Início" },
  { key: "atividades", label: "Atividades" },
  { key: "estoque", label: "Estoque" },
  { key: "equipe", label: "Equipe" },
  { key: "maquinas", label: "Máquinas" },
  { key: "talhoes", label: "Talhões" },
  { key: "clima", label: "Clima" },
  { key: "seguranca", label: "Segurança" },
  { key: "rastreabilidade", label: "Rastreio" },
  { key: "financeiro", label: "Financeiro" },
];

let state = { tab: "inicio", talhoes: [], funcionarios: [], pluviometros: [], epis: [], lotesCafe: [], loteExpandido: null, editando: null };
let graficoFinanceiro = null;

function fmtData(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" }) + " " +
         d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
}

// ---------- Helpers genéricos de editar/excluir ----------
function estaEditando(table, id) {
  return state.editando && state.editando.table === table && String(state.editando.id) === String(id);
}

function botoesAcao(table, id) {
  return `
    <div class="acoes-card">
      <button type="button" class="link-botao btn-editar" data-table="${table}" data-id="${id}">✏️ Editar</button>
      <button type="button" class="link-botao btn-excluir" data-table="${table}" data-id="${id}">🗑️ Excluir</button>
    </div>
  `;
}

function ativarBotoesAcao(container, msgExclusao) {
  container.querySelectorAll(".btn-editar").forEach(btn => {
    btn.onclick = () => {
      state.editando = { table: btn.dataset.table, id: btn.dataset.id };
      render();
    };
  });
  container.querySelectorAll(".btn-excluir").forEach(btn => {
    btn.onclick = async () => {
      if (!confirm(msgExclusao || "Excluir este registro? Essa ação não pode ser desfeita.")) return;
      await sb.from(btn.dataset.table).delete().eq("id", btn.dataset.id);
      render();
    };
  });
}

function ativarFormEdicaoGenerico(container) {
  container.querySelectorAll(".form-edicao").forEach(form => {
    const cancelar = form.querySelector(".btn-cancelar-edicao");
    if (cancelar) cancelar.onclick = () => { state.editando = null; render(); };
    form.onsubmit = async (e) => {
      e.preventDefault();
      const table = form.dataset.table;
      const id = form.dataset.id;
      const campos = JSON.parse(form.dataset.campos);
      const f = new FormData(form);
      const dados = {};
      campos.forEach(nome => {
        const v = f.get(nome);
        dados[nome] = (v === "" || v === null) ? null : v;
      });
      await sb.from(table).update(dados).eq("id", id);
      state.editando = null;
      render();
    };
  });
}

// ---------- Relatórios (imprimir / exportar Excel) ----------
function exportarCSV(nomeArquivo, colunas, linhas) {
  const linhaHeader = colunas.map(c => '"' + c.titulo.replace(/"/g, '""') + '"').join(";");
  const linhasCsv = linhas.map(item => colunas.map(c => {
    let v = c.valor(item);
    if (v === null || v === undefined) v = "";
    v = String(v).replace(/"/g, '""');
    return '"' + v + '"';
  }).join(";"));
  const csv = "\uFEFF" + [linhaHeader, ...linhasCsv].join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = nomeArquivo;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function imprimirRelatorio(titulo, colunas, linhas) {
  const area = document.getElementById("area-impressao");
  const linhasHtml = linhas.map(item => `<tr>${colunas.map(c => `<td>${c.valor(item) ?? ""}</td>`).join("")}</tr>`).join("");
  area.innerHTML = `
    <h1>${titulo}</h1>
    <p>Objetiva Agro — Sítio Jatobá — gerado em ${new Date().toLocaleDateString("pt-BR")}</p>
    <table>
      <thead><tr>${colunas.map(c => `<th>${c.titulo}</th>`).join("")}</tr></thead>
      <tbody>${linhasHtml}</tbody>
    </table>
  `;
  window.print();
}

function montarBotoesRelatorio(containerId, titulo, nomeArquivoBase, colunas, linhas) {
  const container = document.getElementById(containerId);
  if (!container) return;
  if (!linhas || !linhas.length) { container.innerHTML = ""; return; }
  container.innerHTML = `
    <div class="relatorio-botoes">
      <button type="button">🖨️ Imprimir</button>
      <button type="button">📊 Exportar Excel</button>
    </div>
  `;
  const botoes = container.querySelectorAll("button");
  botoes[0].onclick = () => imprimirRelatorio(titulo, colunas, linhas);
  botoes[1].onclick = () => exportarCSV(nomeArquivoBase + "_" + new Date().toISOString().slice(0, 10) + ".csv", colunas, linhas);
}

async function loadLookups() {
  if (!configOk) return;
  const { data: talhoes } = await sb.from("talhoes").select("*").order("nome");
  const { data: funcionarios } = await sb.from("funcionarios").select("*").order("nome");
  const { data: pluviometros } = await sb.from("pluviometros").select("*").order("nome");
  const { data: epis } = await sb.from("epis").select("*").order("nome");
  const { data: lotesCafe } = await sb.from("lotes_cafe").select("*, talhoes(nome)").order("criado_em", { ascending: false });
  state.talhoes = talhoes || [];
  state.funcionarios = funcionarios || [];
  state.pluviometros = pluviometros || [];
  state.epis = epis || [];
  state.lotesCafe = lotesCafe || [];
}

function renderNav() {
  const nav = document.getElementById("nav");
  nav.innerHTML = "";
  TABS.forEach(t => {
    const b = document.createElement("button");
    b.className = "tab" + (state.tab === t.key ? " active" : "");
    b.textContent = t.label;
    b.onclick = () => { state.tab = t.key; render(); };
    nav.appendChild(b);
  });
}

async function render() {
  renderNav();
  const main = document.getElementById("main");

  if (!configOk) {
    main.innerHTML = `<div class="config-warning">
      ⚠️ Falta configurar a conexão com o Supabase. Abra este arquivo, procure
      "CONFIGURACAO" no topo do código e cole a Project URL e a anon key do
      seu projeto (em Project Settings → API no Supabase).
    </div>`;
    return;
  }

  if (libError) {
    main.innerHTML = `<div class="config-warning">⚠️ ${libError}</div>`;
    return;
  }

  await loadLookups();

  if (state.tab === "inicio") return renderInicio(main);
  if (state.tab === "atividades") return renderAtividades(main);
  if (state.tab === "estoque") return renderEstoque(main);
  if (state.tab === "equipe") return renderEquipe(main);
  if (state.tab === "maquinas") return renderMaquinas(main);
  if (state.tab === "talhoes") return renderTalhoes(main);
  if (state.tab === "clima") return renderClima(main);
  if (state.tab === "seguranca") return renderSeguranca(main);
  if (state.tab === "rastreabilidade") return renderRastreabilidade(main);
  if (state.tab === "financeiro") return renderFinanceiro(main);
}

// ---------- Talhões ----------
async function renderTalhoes(main) {
  main.innerHTML = `
    <h2>Talhões</h2>
    <form id="form-talhao">
      <label>Nome do talhão</label>
      <input name="nome" placeholder="Ex: Talhão 3" required />
      <label>Variedade</label>
      <input name="variedade" placeholder="Ex: Catuaí" />
      <div class="row2">
        <div>
          <label>Área (ha)</label>
          <input name="area_ha" type="number" step="0.1" placeholder="0.0" />
        </div>
        <div>
          <label>Idade (anos)</label>
          <input name="idade_anos" type="number" placeholder="0" />
        </div>
      </div>
      <label>Estimativa da safra (sacas)</label>
      <input name="estimativa_sacas" type="number" step="0.1" placeholder="0" />
      <button type="submit">Salvar talhão</button>
    </form>
    <div id="relatorio-talhoes"></div>
    <div id="lista-talhoes"></div>
  `;
  document.getElementById("form-talhao").onsubmit = async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    await sb.from("talhoes").insert({
      nome: f.get("nome"),
      variedade: f.get("variedade") || null,
      area_ha: f.get("area_ha") || null,
      idade_anos: f.get("idade_anos") || null,
      estimativa_sacas: f.get("estimativa_sacas") || null,
    });
    render();
  };
  const list = document.getElementById("lista-talhoes");
  if (!state.talhoes.length) { list.innerHTML = '<div class="empty">Nenhum talhão cadastrado ainda.</div>'; return; }
  const camposTalhao = ["nome", "variedade", "area_ha", "idade_anos", "estimativa_sacas"];
  list.innerHTML = state.talhoes.map(t => {
    if (estaEditando("talhoes", t.id)) {
      return `
        <form class="form-edicao" data-table="talhoes" data-id="${t.id}" data-campos='${JSON.stringify(camposTalhao)}'>
          <label>Nome do talhão</label>
          <input name="nome" value="${t.nome || ""}" required />
          <label>Variedade</label>
          <input name="variedade" value="${t.variedade || ""}" />
          <div class="row2">
            <div>
              <label>Área (ha)</label>
              <input name="area_ha" type="number" step="0.1" value="${t.area_ha ?? ""}" />
            </div>
            <div>
              <label>Idade (anos)</label>
              <input name="idade_anos" type="number" value="${t.idade_anos ?? ""}" />
            </div>
          </div>
          <label>Estimativa da safra (sacas)</label>
          <input name="estimativa_sacas" type="number" step="0.1" value="${t.estimativa_sacas ?? ""}" />
          <div class="row2">
            <button type="submit">Salvar</button>
            <button type="button" class="btn-secundario btn-cancelar-edicao">Cancelar</button>
          </div>
        </form>
      `;
    }
    return `
    <div class="card">
      <div class="title">${t.nome}${t.variedade ? " · " + t.variedade : ""}</div>
      <div class="meta">${t.area_ha ? t.area_ha + "ha" : ""}${t.idade_anos ? " · " + t.idade_anos + " anos" : ""}${t.estimativa_sacas ? " · estimativa " + t.estimativa_sacas + " sc" : ""}</div>
      ${botoesAcao("talhoes", t.id)}
    </div>
  `;
  }).join("");
  ativarBotoesAcao(list, "Excluir este talhão? Isso pode afetar atividades e lotes ligados a ele.");
  ativarFormEdicaoGenerico(list);

  montarBotoesRelatorio("relatorio-talhoes", "Relatório de Talhões", "talhoes", [
    { titulo: "Nome", valor: x => x.nome },
    { titulo: "Variedade", valor: x => x.variedade },
    { titulo: "Área (ha)", valor: x => x.area_ha },
    { titulo: "Idade (anos)", valor: x => x.idade_anos },
    { titulo: "Estimativa (sacas)", valor: x => x.estimativa_sacas },
  ], state.talhoes);
}

// ---------- Atividades ----------
async function renderAtividades(main) {
  const { data: atividades } = await sb.from("atividades").select("*, talhoes(nome)").order("data_registro", { ascending: false }).limit(30);
  const talhaoOptions = state.talhoes.map(t => `<option value="${t.id}">${t.nome}</option>`).join("");
  main.innerHTML = `
    <h2>Atividades</h2>
    <form id="form-atividade">
      <label>Talhão</label>
      <select name="talhao_id" required>
        <option value="">Selecione...</option>
        ${talhaoOptions}
      </select>
      <label>Tipo de atividade</label>
      <select name="tipo" required>
        <option value="">Selecione...</option>
        <option>Poda</option><option>Adubação</option><option>Aplicação</option>
        <option>Colheita</option><option>Irrigação</option><option>Outro</option>
      </select>
      <label>Nota (texto do registro)</label>
      <textarea name="nota" placeholder="Ex: aplicamos herbicida, 20 litros"></textarea>
      <button type="submit">Registrar atividade</button>
    </form>

// ---------- Estoque ----------
async function renderEstoque(main) {
  const { data: itens } = await sb.from("itens_estoque").select("*").order("nome");

    .select("*, itens_estoque(nome, unidade)")
    .order("data", { ascending: false })
    .limit(60);
  const itemOptions = (itens || []).map(i => `<option value="${i.id}">${i.nome}</option>`).join("");

  main.innerHTML = `
    <h2>Estoque</h2>
    <form id="form-item">
      <label>Cadastrar novo item</label>
      <input name="nome" placeholder="Ex: Herbicida pós-emergente" required />
      <div class="row2">
        <div>
          <label>Categoria</label>
          <input name="categoria" placeholder="Ex: Defensivo" />
        </div>
        <div>
          <label>Unidade</label>
          <input name="unidade" placeholder="Ex: L, kg, un" />
        </div>
      </div>
      <div class="row2">
        <div>
          <label>Quantidade inicial</label>
          <input name="quantidade" type="number" step="0.1" placeholder="0" />
        </div>
        <div>
          <label>Quantidade mínima</label>
          <input name="quantidade_minima" type="number" step="0.1" placeholder="0" />
        </div>
      </div>
      <button type="submit">Salvar item</button>
    </form>
    <div id="relatorio-estoque"></div>
    <div id="lista-estoque"></div>

    <form id="form-movimento" style="margin-top:16px;">
      <label>Registrar entrada ou saída</label>
      <select name="item_id" required>
        <option value="">Selecione o item...</option>
        ${itemOptions}
      </select>
      <select name="tipo" required>
        <option value="">Tipo...</option>
        <option value="Entrada">Entrada</option>
        <option value="Saída">Saída</option>
      </select>
      <div class="row2">
        <div>
          <label>Quantidade</label>
          <input name="quantidade" type="number" step="0.1" placeholder="0" required />
        </div>
        <div>
          <label>Data</label>
          <input name="data" type="date" required />
        </div>
      </div>
      <label>Observação (opcional)</label>
      <input name="observacao" placeholder="Ex: compra, aplicação no talhão 2..." />
      <label>Valor pago (R$) — só para entradas, lança sozinho no Financeiro</label>
      <input name="valor_pago" type="number" step="0.01" placeholder="0,00" />
      <select name="categoria_financeira">
        ${CATEGORIAS_SAIDA.map(c => `<option value="${c}" ${c === "Insumos e Defensivos" ? "selected" : ""}>${c}</option>`).join("")}
      </select>
      <button type="submit">Registrar movimento</button>
    </form>
    <div id="lista-movimentos-estoque"></div>
    <div id="relatorio-movimentos-estoque"></div>
  `;

  const dataMovInput = document.querySelector('#form-movimento input[name="data"]');
  if (dataMovInput) dataMovInput.value = new Date().toISOString().slice(0, 10);

  document.getElementById("form-item").onsubmit = async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    await sb.from("itens_estoque").insert({
      nome: f.get("nome"),
      categoria: f.get("categoria") || null,
      unidade: f.get("unidade") || null,
      quantidade: f.get("quantidade") || 0,
      quantidade_minima: f.get("quantidade_minima") || 0,
    });
    render();
  };
  const list = document.getElementById("lista-estoque");
  if (!itens || !itens.length) { list.innerHTML = '<div class="empty">Nenhum item no estoque ainda.</div>'; }
  else {
    const camposItem = ["nome", "categoria", "unidade", "quantidade", "quantidade_minima"];
    list.innerHTML = itens.map(i => {
      if (estaEditando("itens_estoque", i.id)) {
        return `
          <form class="form-edicao" data-table="itens_estoque" data-id="${i.id}" data-campos='${JSON.stringify(camposItem)}'>
            <label>Nome do item</label>
            <input name="nome" value="${i.nome || ""}" required />
            <div class="row2">
              <div>
                <label>Categoria</label>
                <input name="categoria" value="${i.categoria || ""}" />
              </div>
              <div>
                <label>Unidade</label>
                <input name="unidade" value="${i.unidade || ""}" />
              </div>
            </div>
            <div class="row2">
              <div>
                <label>Quantidade atual</label>
                <input name="quantidade" type="number" step="0.1" value="${i.quantidade ?? ""}" />
              </div>
              <div>
                <label>Quantidade mínima</label>
                <input name="quantidade_minima" type="number" step="0.1" value="${i.quantidade_minima ?? ""}" />
              </div>
            </div>
            <div class="row2">
              <button type="submit">Salvar</button>
              <button type="button" class="btn-secundario btn-cancelar-edicao">Cancelar</button>
            </div>
          </form>
        `;
      }
      const critico = i.quantidade_minima && i.quantidade <= i.quantidade_minima;
      return `
      <div class="card">
        <div class="title">${i.nome} ${critico ? '<span class="badge critico">repor</span>' : ""}</div>
        <div class="meta">${i.quantidade ?? 0} ${i.unidade || ""} · mínimo ${i.quantidade_minima ?? 0}${i.unidade || ""}</div>
        ${botoesAcao("itens_estoque", i.id)}
      </div>`;
    }).join("");
    ativarBotoesAcao(list, "Excluir este item do estoque? O histórico de movimentos dele não será apagado.");
    ativarFormEdicaoGenerico(list);
  }

  montarBotoesRelatorio("relatorio-estoque", "Relatório de Estoque", "estoque", [
    { titulo: "Nome", valor: x => x.nome },
    { titulo: "Categoria", valor: x => x.categoria },
    { titulo: "Unidade", valor: x => x.unidade },
    { titulo: "Quantidade", valor: x => x.quantidade },
    { titulo: "Quantidade Mínima", valor: x => x.quantidade_minima },
  ], itens);

  // ---- Movimentos de estoque (entradas/saídas) ----
  document.getElementById("form-movimento").onsubmit = async (e) => {
    e.preventDefault();
    if (!itens || !itens.length) { alert("Cadastre um item primeiro, no formulário acima."); return; }
    const f = new FormData(e.target);
    const itemId = f.get("item_id");
    const tipo = f.get("tipo");
    const quantidade = Number(f.get("quantidade")) || 0;
    const valorPago = f.get("valor_pago");
    const data = f.get("data");

    await sb.from("movimentos_estoque").insert({
      item_id: itemId,
      tipo: tipo,
      quantidade: quantidade,
      data: data,
      observacao: f.get("observacao") || null,
    });

    const item = itens.find(x => x.id === itemId);
    if (item) {
      const delta = tipo === "Entrada" ? quantidade : -quantidade;
      const novaQtd = Math.max(0, Number(item.quantidade || 0) + delta);
      await sb.from("itens_estoque").update({ quantidade: novaQtd }).eq("id", itemId);
    }

    if (tipo === "Entrada" && valorPago) {
      await sb.from("lancamentos_financeiros").insert({
        data: data,
        tipo: "Saída",
        categoria: f.get("categoria_financeira") || "Insumos e Defensivos",
        descricao: `Compra de ${item ? item.nome : "item"} (${quantidade} ${item && item.unidade ? item.unidade : ""})`,
        valor: valorPago,
      });
    }

    render();
  };

  const listaMov = document.getElementById("lista-movimentos-estoque");
  if (!movimentos || !movimentos.length) {
    listaMov.innerHTML = '<div class="empty">Nenhuma movimentação registrada ainda.</div>';
    return;
  }
  listaMov.innerHTML = movimentos.map(m => {
    if (estaEditando("movimentos_estoque", m.id)) {
      return `
        <form class="form-edicao-movimento" data-id="${m.id}" data-item-antigo="${m.item_id}" data-qtd-antiga="${m.quantidade}" data-tipo-antigo="${m.tipo}">
          <select name="item_id" required>
            ${itens.map(i => `<option value="${i.id}" ${i.id === m.item_id ? "selected" : ""}>${i.nome}</option>`).join("")}
          </select>
          <select name="tipo" required>
            <option value="Entrada" ${m.tipo === "Entrada" ? "selected" : ""}>Entrada</option>
            <option value="Saída" ${m.tipo === "Saída" ? "selected" : ""}>Saída</option>
          </select>
          <div class="row2">
            <div>
              <label>Quantidade</label>
              <input name="quantidade" type="number" step="0.1" value="${m.quantidade}" required />
            </div>
            <div>
              <label>Data</label>
              <input name="data" type="date" value="${m.data || ""}" required />
            </div>
          </div>
          <input name="observacao" placeholder="Observação" value="${m.observacao || ""}" />
          <div class="row2">
            <button type="submit">Salvar</button>
            <button type="button" class="btn-secundario btn-cancelar-edicao">Cancelar</button>
          </div>
        </form>
      `;
    }
    const cor = m.tipo === "Entrada" ? "var(--leaf)" : "var(--cherry)";
    const sinal = m.tipo === "Entrada" ? "+" : "-";
    return `
    <div class="card">
      <div class="title">${m.itens_estoque ? m.itens_estoque.nome : "item"} <span style="color:${cor};font-weight:700;">${sinal} ${m.quantidade} ${m.itens_estoque ? m.itens_estoque.unidade || "" : ""}</span></div>
      ${m.observacao ? `<div class="nota">${m.observacao}</div>` : ""}
      <div class="meta">${fmtDataSimples(m.data)}</div>
      ${botoesAcao("movimentos_estoque", m.id)}
    </div>
  `;
  }).join("");

  listaMov.querySelectorAll(".btn-editar[data-table='movimentos_estoque']").forEach(btn => {
    btn.onclick = () => { state.editando = { table: "movimentos_estoque", id: btn.dataset.id }; render(); };
  });
  listaMov.querySelectorAll(".btn-excluir[data-table='movimentos_estoque']").forEach(btn => {
    btn.onclick = async () => {
      if (!confirm("Excluir esta movimentação? O estoque será ajustado de volta automaticamente.")) return;
      const m = movimentos.find(x => x.id === btn.dataset.id);
      if (m) {
        const item = itens.find(x => x.id === m.item_id);
        if (item) {
          const delta = m.tipo === "Entrada" ? -Number(m.quantidade || 0) : Number(m.quantidade || 0);
          const novaQtd = Math.max(0, Number(item.quantidade || 0) + delta);
          await sb.from("itens_estoque").update({ quantidade: novaQtd }).eq("id", m.item_id);
        }
      }
      await sb.from("movimentos_estoque").delete().eq("id", btn.dataset.id);
      render();
    };
  });
  listaMov.querySelectorAll(".form-edicao-movimento").forEach(form => {
    const cancelar = form.querySelector(".btn-cancelar-edicao");
    if (cancelar) cancelar.onclick = () => { state.editando = null; render(); };
    form.onsubmit = async (e) => {
      e.preventDefault();
      const id = form.dataset.id;
      const itemAntigo = form.dataset.itemAntigo;
      const qtdAntiga = Number(form.dataset.qtdAntiga);
      const tipoAntigo = form.dataset.tipoAntigo;
      const f = new FormData(form);
      const novoItemId = f.get("item_id");
      const novoTipo = f.get("tipo");
      const novaQtd = Number(f.get("quantidade"));

      // Reverte o efeito do movimento antigo no item antigo
      const itemAntigoObj = itens.find(x => x.id === itemAntigo);
      const deltaReversao = tipoAntigo === "Entrada" ? -qtdAntiga : qtdAntiga;
      const estoqueAntigoRevertido = itemAntigoObj ? Math.max(0, Number(itemAntigoObj.quantidade || 0) + deltaReversao) : null;
      if (itemAntigoObj) {
        await sb.from("itens_estoque").update({ quantidade: estoqueAntigoRevertido }).eq("id", itemAntigo);
      }

      // Aplica o novo movimento no item novo (pode ser o mesmo item)
      let baseParaNovoItem;
      if (novoItemId === itemAntigo) {
        baseParaNovoItem = estoqueAntigoRevertido;
      } else {
        const itemNovoObj = itens.find(x => x.id === novoItemId);
        baseParaNovoItem = itemNovoObj ? Number(itemNovoObj.quantidade || 0) : 0;
      }
      const deltaNovo = novoTipo === "Entrada" ? novaQtd : -novaQtd;
      const qtdFinal = Math.max(0, (baseParaNovoItem || 0) + deltaNovo);
      await sb.from("itens_estoque").update({ quantidade: qtdFinal }).eq("id", novoItemId);

      await sb.from("movimentos_estoque").update({
        item_id: novoItemId,
        tipo: novoTipo,
        quantidade: novaQtd,
        data: f.get("data"),
        observacao: f.get("observacao") || null,
      }).eq("id", id);

      state.editando = null;
      render();
    };
  });

  montarBotoesRelatorio("relatorio-movimentos-estoque", "Relatório de Movimentos de Estoque", "movimentos_estoque", [
    { titulo: "Item", valor: x => x.itens_estoque ? x.itens_estoque.nome : "" },
    { titulo: "Tipo", valor: x => x.tipo },
    { titulo: "Quantidade", valor: x => x.quantidade },
    { titulo: "Data", valor: x => fmtDataSimples(x.data) },
    { titulo: "Observação", valor: x => x.observacao },
  ], movimentos);
}

function fmtDataSimples(dataISO) {
  if (!dataISO) return "";
  const [ano, mes, dia] = dataISO.split("-");
  return `${dia}/${mes}/${ano}`;
}

    .order("data_entrega", { ascending: false })
    .limit(30);

  ).join("");
  const funcOptions = state.funcionarios.map(f =>
    `<option value="${f.id}">${f.nome}</option>`
  ).join("");

  main.innerHTML = `
    <h2>Segurança do Trabalho</h2>

    <form id="form-epi">
      <label>Cadastrar novo EPI</label>
      <input name="nome" placeholder="Ex: Luva de raspa" required />

        ${funcOptions}
      </select>
      <select name="epi_id" required>
        <option value="">EPI...</option>
        ${epiOptions}
      </select>
      <label>Quantidade</label>
      <input name="quantidade" type="number" step="1" value="1" required />
      <label>Assinatura do funcionário (recebimento)</label>
      <canvas id="sig-canvas" class="sig-canvas"></canvas>
      <button type="button" id="btn-limpar-assinatura" class="btn-secundario">Limpar assinatura</button>
      <button type="submit">Confirmar entrega</button>
    </form>

    <div id="lista-entregas"></div>
    <div id="relatorio-entregas"></div>
  `;

  document.getElementById("form-epi").onsubmit = async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    await sb.from("epis").insert({
      nome: f.get("nome"),
      ca_numero: f.get("ca_numero") || null,
      quantidade_atual: f.get("quantidade_atual") || 0,
      quantidade_minima: f.get("quantidade_minima") || 0,
    });
    render();
  };

  const list = document.getElementById("lista-epis");
  const camposEpi = ["nome", "ca_numero", "quantidade_atual", "quantidade_minima"];
  if (!state.epis.length) {
    list.innerHTML = '<div class="empty">Nenhum EPI cadastrado ainda.</div>';
  } else {
    list.innerHTML = state.epis.map(e => {
      if (estaEditando("epis", e.id)) {
        return `
          <form class="form-edicao" data-table="epis" data-id="${e.id}" data-campos='${JSON.stringify(camposEpi)}'>
            <label>Nome do EPI</label>
            <input name="nome" value="${e.nome || ""}" required />
            <input name="ca_numero" placeholder="Número do CA" value="${e.ca_numero || ""}" />
            <div class="row2">
              <div>
                <label>Quantidade atual</label>
                <input name="quantidade_atual" type="number" step="1" value="${e.quantidade_atual ?? ""}" />
              </div>
              <div>
                <label>Quantidade mínima</label>
                <input name="quantidade_minima" type="number" step="1" value="${e.quantidade_minima ?? ""}" />
              </div>
            </div>
            <div class="row2">
              <button type="submit">Salvar</button>
              <button type="button" class="btn-secundario btn-cancelar-edicao">Cancelar</button>
            </div>
          </form>
        `;
      }
      const critico = e.quantidade_minima && e.quantidade_atual <= e.quantidade_minima;
      return `
      <div class="card">
        <div class="title">${e.nome} ${critico ? '<span class="badge critico">repor</span>' : ""}</div>
        <div class="meta">${e.quantidade_atual ?? 0} un. · mínimo ${e.quantidade_minima ?? 0}${e.ca_numero ? " · CA " + e.ca_numero : ""}</div>
        ${botoesAcao("epis", e.id)}
      </div>`;
    }).join("");
    ativarBotoesAcao(list, "Excluir este EPI do cadastro?");
    ativarFormEdicaoGenerico(list);
    montarBotoesRelatorio("relatorio-epis", "Relatório de EPIs", "epis", [
      { titulo: "Nome", valor: x => x.nome },
      { titulo: "Número do CA", valor: x => x.ca_numero },
      { titulo: "Quantidade Atual", valor: x => x.quantidade_atual },
      { titulo: "Quantidade Mínima", valor: x => x.quantidade_minima },
    ], state.epis);
  }

  // ---- Quadro de assinatura ----
  const canvas = document.getElementById("sig-canvas");
  const ctx = canvas.getContext("2d");
  function ajustarCanvas() {
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    ctx.strokeStyle = "#1E3A2A";
  }
  ajustarCanvas();
  let desenhando = false;
  let temAssinatura = false;

  function pos(e) {
    const rect = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - rect.left, y: t.clientY - rect.top };
  }
  function iniciar(e) {
    desenhando = true;
    temAssinatura = true;
    const p = pos(e);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    e.preventDefault();
  }
  function mover(e) {
    if (!desenhando) return;
    const p = pos(e);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    e.preventDefault();
  }
  function parar() { desenhando = false; }

  canvas.addEventListener("mousedown", iniciar);
  canvas.addEventListener("mousemove", mover);
  window.addEventListener("mouseup", parar);
  canvas.addEventListener("touchstart", iniciar);
  canvas.addEventListener("touchmove", mover);
  canvas.addEventListener("touchend", parar);

  document.getElementById("btn-limpar-assinatura").onclick = () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    temAssinatura = false;
  };

  document.getElementById("form-saida").onsubmit = async (e) => {
    e.preventDefault();
    if (!state.epis.length) { alert("Cadastre um EPI primeiro, no formulário acima."); return; }
    if (!state.funcionarios.length) { alert("Cadastre um funcionário primeiro, na aba Equipe."); return; }
    if (!temAssinatura) { alert("Peça para o funcionário assinar no quadro antes de confirmar."); return; }
    const f = new FormData(e.target);
    const assinaturaBase64 = canvas.toDataURL("image/png");
    const epiId = f.get("epi_id");
    const quantidade = Number(f.get("quantidade")) || 1;

    await sb.from("movimentos_epi").insert({
      epi_id: epiId,
      funcionario_id: f.get("funcionario_id"),
      quantidade: quantidade,
      assinatura: assinaturaBase64,
    });

    // Abate a quantidade entregue do estoque do EPI
    const epiAtual = state.epis.find(x => x.id === epiId);
    if (epiAtual) {
      const novaQtd = Math.max(0, Number(epiAtual.quantidade_atual || 0) - quantidade);
      await sb.from("epis").update({ quantidade_atual: novaQtd }).eq("id", epiId);
    }

    render();
  };

  const listaEntregas = document.getElementById("lista-entregas");
  if (!movimentos || !movimentos.length) {
    listaEntregas.innerHTML = '<div class="empty">Nenhuma entrega registrada ainda.</div>';
    return;
  }
  listaEntregas.innerHTML = movimentos.map(m => {
    if (estaEditando("movimentos_epi", m.id)) {
      return `
        <form class="form-edicao-entrega" data-id="${m.id}" data-epi-antigo="${m.epi_id}" data-qtd-antiga="${m.quantidade}">
          <label>Funcionário</label>
          <select name="funcionario_id" required>
            ${state.funcionarios.map(fu => `<option value="${fu.id}" ${fu.id === m.funcionario_id ? "selected" : ""}>${fu.nome}</option>`).join("")}
          </select>
          <label>EPI</label>
          <select name="epi_id" required>
            ${state.epis.map(e => `<option value="${e.id}" ${e.id === m.epi_id ? "selected" : ""}>${e.nome}</option>`).join("")}
          </select>
          <label>Quantidade</label>
          <input name="quantidade" type="number" step="1" value="${m.quantidade}" required />
          <div class="row2">
            <button type="submit">Salvar</button>
            <button type="button" class="btn-secundario btn-cancelar-edicao">Cancelar</button>
          </div>
        </form>
      `;
    }
    return `
    <div class="card">
      <div class="title">${m.epis ? m.epis.nome : "EPI"} — ${m.quantidade} un.</div>
      <div class="meta">${m.funcionarios ? m.funcionarios.nome : "funcionário"} · ${fmtData(m.data_entrega)}</div>
      ${m.assinatura ? `<img class="sig-preview" src="${m.assinatura}" alt="assinatura" />` : ""}
      ${botoesAcao("movimentos_epi", m.id)}
    </div>
  `;
  }).join("");

  listaEntregas.querySelectorAll(".btn-editar[data-table='movimentos_epi']").forEach(btn => {
    btn.onclick = () => { state.editando = { table: "movimentos_epi", id: btn.dataset.id }; render(); };
  });
  listaEntregas.querySelectorAll(".btn-excluir[data-table='movimentos_epi']").forEach(btn => {
    btn.onclick = async () => {
      if (!confirm("Excluir esta entrega? O estoque do EPI será devolvido automaticamente.")) return;
      const m = movimentos.find(x => x.id === btn.dataset.id);
      if (m) {
        const epiAtual = state.epis.find(x => x.id === m.epi_id);
        if (epiAtual) {
          const novaQtd = Number(epiAtual.quantidade_atual || 0) + Number(m.quantidade || 0);
          await sb.from("epis").update({ quantidade_atual: novaQtd }).eq("id", m.epi_id);
        }
      }
      await sb.from("movimentos_epi").delete().eq("id", btn.dataset.id);
      render();
    };
  });
  listaEntregas.querySelectorAll(".form-edicao-entrega").forEach(form => {
    const cancelar = form.querySelector(".btn-cancelar-edicao");
    if (cancelar) cancelar.onclick = () => { state.editando = null; render(); };
    form.onsubmit = async (e) => {
      e.preventDefault();
      const id = form.dataset.id;
      const epiAntigo = form.dataset.epiAntigo;
      const qtdAntiga = Number(form.dataset.qtdAntiga);
      const f = new FormData(form);
      const novoEpiId = f.get("epi_id");
      const novaQtd = Number(f.get("quantidade"));

      const epiAntigoObj = state.epis.find(x => x.id === epiAntigo);
      const estoqueAntigoRevertido = epiAntigoObj ? Number(epiAntigoObj.quantidade_atual || 0) + qtdAntiga : null;
      if (epiAntigoObj) {
        await sb.from("epis").update({ quantidade_atual: estoqueAntigoRevertido }).eq("id", epiAntigo);
      }

      let baseParaNovoEpi;
      if (novoEpiId === epiAntigo) {
        baseParaNovoEpi = estoqueAntigoRevertido;
      } else {
        const epiNovoObj = state.epis.find(x => x.id === novoEpiId);
        baseParaNovoEpi = epiNovoObj ? Number(epiNovoObj.quantidade_atual || 0) : 0;
      }
      const qtdFinal = Math.max(0, (baseParaNovoEpi || 0) - novaQtd);
      await sb.from("epis").update({ quantidade_atual: qtdFinal }).eq("id", novoEpiId);

      await sb.from("movimentos_epi").update({
        epi_id: novoEpiId,
        funcionario_id: f.get("funcionario_id"),
        quantidade: novaQtd,
      }).eq("id", id);

      state.editando = null;
      render();
    };
  });

  montarBotoesRelatorio("relatorio-entregas", "Relatório de Entregas de EPI", "entregas_epi", [
    { titulo: "EPI", valor: x => x.epis ? x.epis.nome : "" },
    { titulo: "Funcionário", valor: x => x.funcionarios ? x.funcionarios.nome : "" },
    { titulo: "Quantidade", valor: x => x.quantidade },
    { titulo: "Data", valor: x => fmtData(x.data_entrega) },
  ], movimentos);
}

    <h2>Resumo — ${hoje.toLocaleDateString("pt-BR", { day: "2-digit", month: "long" })}</h2>

    <div class="grid-resumo">
      <div class="stat-card">
        <div class="numero">${state.talhoes.length}</div>
        <div class="rotulo">Talhões ativos</div>
      </div>
      <div class="stat-card">
        <div class="numero">${(itensEstoque || []).length}</div>
        <div class="rotulo">Itens em estoque</div>
      </div>
      <div class="stat-card">
        <div class="numero">${state.funcionarios.length}</div>
        <div class="rotulo">Colaboradores</div>
      </div>
      <div class="stat-card">
        <div class="numero">${(atividadesHoje || []).length}</div>
        <div class="rotulo">Atividades hoje</div>
      </div>
    </div>

    ${chuva ? `
      <div class="card">
        <div class="title">🌧️ Última chuva registrada: ${chuva.volume_mm ?? 0} mm</div>
        <div class="meta">${chuva.pluviometros ? chuva.pluviometros.nome : ""}${chuva.pluviometros && chuva.pluviometros.propriedade ? " · " + chuva.pluviometros.propriedade : ""} · ${fmtDataSimples(chuva.data_leitura)}</div>
      </div>
    ` : ""}

    ${(itensCriticos.length || episCriticos.length) ? `
      <div class="secao-titulo">Alertas</div>
      ${itensCriticos.map(i => `
        <div class="alerta-card">
          <span class="titulo">Estoque baixo:</span> ${i.nome} (${i.quantidade ?? 0}${i.unidade || ""} restante)
        </div>
      `).join("")}
      ${episCriticos.map(e => `
        <div class="alerta-card">
          <span class="titulo">EPI baixo:</span> ${e.nome} (${e.quantidade_atual ?? 0} un. restante)
        </div>
      `).join("")}
    ` : ""}

    <div class="secao-titulo">Atividades de hoje</div>
    ${(atividadesHoje && atividadesHoje.length) ? atividadesHoje.map(a => `
      <div class="card">
        <div class="title">${a.tipo} — ${a.talhoes ? a.talhoes.nome : "talhão"}</div>
        ${a.nota ? `<div class="nota">${a.nota}</div>` : ""}
        <div class="meta">${fmtData(a.data_registro)}</div>
      </div>
    `).join("") : '<div class="empty">Nenhuma atividade registrada hoje ainda.</div>'}
  `;
}

// ---------- Rastreabilidade do café ----------
const ETAPAS_LOTE = ["Colheita", "Processamento - Natural", "Processamento - Cereja Descascado", "Processamento - Lavado", "Secagem", "Armazenamento", "Venda/Saída", "Outro"];

async function renderRastreabilidade(main) {
  const talhaoOptions = state.talhoes.map(t => `<option value="${t.id}">${t.nome}</option>`).join("");
  const etapaOptions = ETAPAS_LOTE.map(e => `<option value="${e}">${e}</option>`).join("");

  let eventosDoLoteExpandido = [];
  if (state.loteExpandido) {
    const { data } = await sb.from("eventos_lote")
      .select("*")
      .eq("lote_id", state.loteExpandido)
      .order("data_evento", { ascending: true });
    eventosDoLoteExpandido = data || [];
  }

  const { data: todosEventos } = await sb.from("eventos_lote")
    .select("*, lotes_cafe(codigo, talhao_id)")
    .order("data_evento", { ascending: true });

  const { data: configLitros } = await sb.from("configuracoes").select("*").eq("chave", "litros_por_saca");
  const litrosPorSaca = (configLitros && configLitros[0]) ? Number(configLitros[0].valor) : 300;

  const litrosPorTalhao = {};
  (todosEventos || []).forEach(ev => {
    if (ev.etapa !== "Colheita" || !ev.lotes_cafe || !ev.lotes_cafe.talhao_id) return;
    const talhaoId = ev.lotes_cafe.talhao_id;
    litrosPorTalhao[talhaoId] = (litrosPorTalhao[talhaoId] || 0) + Number(ev.volume_litros || 0);
  });

  const cardsProgresso = state.talhoes.map(t => {
    const litros = litrosPorTalhao[t.id] || 0;
    const sacas = litrosPorSaca > 0 ? litros / litrosPorSaca : 0;
    const estimativa = Number(t.estimativa_sacas || 0);
    const pct = estimativa > 0 ? Math.min(100, Math.round((sacas / estimativa) * 100)) : null;
    return `
      <div class="card">
        <div class="title">${t.nome}</div>
        <div class="meta">${litros.toFixed(0)} L colhidos ≈ ${sacas.toFixed(1)} sc${estimativa ? " de " + estimativa + " sc estimadas" : " · sem estimativa cadastrada"}</div>
        ${pct !== null ? `
          <div class="progresso-container">
            <div class="progresso-barra ${pct >= 100 ? "acima" : ""}" style="width:${pct}%;"></div>
          </div>
          <div class="meta">${pct}% da safra estimada</div>
        ` : ""}
      </div>
    `;
  }).join("");

  main.innerHTML = `
    <h2>Rastreabilidade do Café</h2>

    ${state.talhoes.length ? `
      <div class="secao-titulo">Progresso da Colheita</div>
      <form id="form-config-litros" style="margin-bottom:12px;">
        <label>Litros por saca beneficiada (média)</label>
        <input name="litros_por_saca" type="number" step="1" value="${litrosPorSaca}" />
        <button type="submit" class="btn-secundario">Salvar</button>
      </form>
      ${cardsProgresso}
    ` : ""}

    <form id="form-lote" style="margin-top:16px;">
      <label>Novo lote</label>
      <input name="codigo" placeholder="Ex: Lote-2026-01" required />
      <select name="talhao_id">
        <option value="">Talhão de origem (opcional)</option>
        ${talhaoOptions}
      </select>
      <label>Data da colheita</label>
      <input name="data_colheita" type="date" />
      <label>Observação (opcional)</label>
      <input name="observacao" placeholder="Ex: variedade, altitude..." />
      <button type="submit">Criar lote</button>
    </form>

    <div id="relatorio-lotes"></div>
    <div id="lista-lotes"></div>
    <div id="relatorio-eventos"></div>
  `;

  document.getElementById("form-config-litros").onsubmit = async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    await sb.from("configuracoes").upsert({ chave: "litros_por_saca", valor: f.get("litros_por_saca") });
    render();
  };

  document.getElementById("form-lote").onsubmit = async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    await sb.from("lotes_cafe").insert({
      codigo: f.get("codigo"),
      talhao_id: f.get("talhao_id") || null,
      data_colheita: f.get("data_colheita") || null,
      observacao: f.get("observacao") || null,
    });
    render();
  };

  const list = document.getElementById("lista-lotes");
  if (!state.lotesCafe.length) {
    list.innerHTML = '<div class="empty">Nenhum lote de café cadastrado ainda.</div>';
    return;
  }

  list.innerHTML = state.lotesCafe.map(lote => {
    if (estaEditando("lotes_cafe", lote.id)) {
      const camposLote = ["codigo", "talhao_id", "data_colheita", "observacao"];
      return `
        <form class="form-edicao" data-table="lotes_cafe" data-id="${lote.id}" data-campos='${JSON.stringify(camposLote)}'>
          <label>Código</label>
          <input name="codigo" value="${lote.codigo || ""}" required />
          <select name="talhao_id">
            <option value="">Talhão de origem (opcional)</option>
            ${state.talhoes.map(t => `<option value="${t.id}" ${t.id === lote.talhao_id ? "selected" : ""}>${t.nome}</option>`).join("")}
          </select>
          <label>Data da colheita</label>
          <input name="data_colheita" type="date" value="${lote.data_colheita || ""}" />
          <input name="observacao" placeholder="Observação" value="${lote.observacao || ""}" />
          <div class="row2">
            <button type="submit">Salvar</button>
            <button type="button" class="btn-secundario btn-cancelar-edicao">Cancelar</button>
          </div>
        </form>
      `;
    }
    const expandido = state.loteExpandido === lote.id;
    return `
      <div class="card">
        <div class="title">${lote.codigo}</div>
        <div class="meta">${lote.talhoes ? lote.talhoes.nome + " · " : ""}${lote.data_colheita ? "colhido em " + fmtDataSimples(lote.data_colheita) : ""}</div>
        ${lote.observacao ? `<div class="nota">${lote.observacao}</div>` : ""}
        <button type="button" class="link-botao btn-expandir-lote" data-lote="${lote.id}">${expandido ? "▴ Fechar histórico" : "▾ Ver histórico / adicionar etapa"}</button>
        ${botoesAcao("lotes_cafe", lote.id)}
        ${expandido ? `
          <div id="timeline-${lote.id}">
            ${eventosDoLoteExpandido.length ? eventosDoLoteExpandido.map(ev => {
              if (estaEditando("eventos_lote", ev.id)) {
                const camposEvento = ["etapa", "data_evento", "peso_kg", "volume_litros", "observacao"];
                return `
                  <form class="form-edicao" data-table="eventos_lote" data-id="${ev.id}" data-campos='${JSON.stringify(camposEvento)}'>
                    <select name="etapa" required>
                      ${ETAPAS_LOTE.map(et => `<option value="${et}" ${et === ev.etapa ? "selected" : ""}>${et}</option>`).join("")}
                    </select>
                    <div class="row2">
                      <div>
                        <label>Data</label>
                        <input name="data_evento" type="date" value="${ev.data_evento || ""}" required />
                      </div>
                      <div>
                        <label>Peso (kg)</label>
                        <input name="peso_kg" type="number" step="0.1" value="${ev.peso_kg ?? ""}" />
                      </div>
                    </div>
                    <label>Volume colhido (litros) — só para etapa Colheita</label>
                    <input name="volume_litros" type="number" step="1" value="${ev.volume_litros ?? ""}" />
                    <input name="observacao" value="${ev.observacao || ""}" />
                    <div class="row2">
                      <button type="submit">Salvar</button>
                      <button type="button" class="btn-secundario btn-cancelar-edicao">Cancelar</button>
                    </div>
                  </form>
                `;
              }
              return `
              <div class="timeline-item">
                <div class="etapa">${ev.etapa}</div>
                <div class="meta">${fmtDataSimples(ev.data_evento)}${ev.peso_kg ? " · " + ev.peso_kg + " kg" : ""}${ev.volume_litros ? " · " + ev.volume_litros + " L" : ""}</div>
                ${ev.observacao ? `<div class="nota">${ev.observacao}</div>` : ""}
                ${botoesAcao("eventos_lote", ev.id)}
              </div>
            `;
            }).join("") : '<div class="empty">Nenhuma etapa registrada ainda.</div>'}
          </div>
          <form class="form-evento" data-lote="${lote.id}" style="margin-top:8px;">
            <select name="etapa" required>
              <option value="">Etapa...</option>
              ${etapaOptions}
            </select>
            <div class="row2">
              <div>
                <label>Data</label>
                <input name="data_evento" type="date" required />
              </div>
              <div>
                <label>Peso (kg, opcional)</label>
                <input name="peso_kg" type="number" step="0.1" placeholder="0" />
              </div>
            </div>
            <label>Volume colhido (litros) — só para etapa Colheita</label>
            <input name="volume_litros" type="number" step="1" placeholder="0" />
            <input name="observacao" placeholder="Observação (opcional)" />
            <button type="submit">Adicionar etapa</button>
          </form>
        ` : ""}
      </div>
    `;
  }).join("");

  list.querySelectorAll(".btn-expandir-lote").forEach(btn => {
    btn.onclick = () => {
      const id = btn.getAttribute("data-lote");
      state.loteExpandido = (state.loteExpandido === id) ? null : id;
      render();
    };
  });

  ativarBotoesAcao(list, "Excluir este registro? Essa ação não pode ser desfeita.");
  ativarFormEdicaoGenerico(list);

  list.querySelectorAll(".form-evento").forEach(form => {
    const dataInput = form.querySelector('input[name="data_evento"]');
    if (dataInput) dataInput.value = new Date().toISOString().slice(0, 10);
    form.onsubmit = async (e) => {
      e.preventDefault();
      const loteId = form.getAttribute("data-lote");
      const f = new FormData(form);
      await sb.from("eventos_lote").insert({
        lote_id: loteId,
        etapa: f.get("etapa"),
        data_evento: f.get("data_evento"),
        peso_kg: f.get("peso_kg") || null,
        volume_litros: f.get("volume_litros") || null,
        observacao: f.get("observacao") || null,
      });
      render();
    };
  });

  montarBotoesRelatorio("relatorio-lotes", "Relatório de Lotes de Café", "lotes_cafe", [
    { titulo: "Código", valor: x => x.codigo },
    { titulo: "Talhão", valor: x => x.talhoes ? x.talhoes.nome : "" },
    { titulo: "Data da Colheita", valor: x => fmtDataSimples(x.data_colheita) },
    { titulo: "Observação", valor: x => x.observacao },
  ], state.lotesCafe);

  montarBotoesRelatorio("relatorio-eventos", "Histórico Completo de Rastreabilidade", "historico_lotes", [
    { titulo: "Lote", valor: x => x.lotes_cafe ? x.lotes_cafe.codigo : "" },
    { titulo: "Etapa", valor: x => x.etapa },
    { titulo: "Data", valor: x => fmtDataSimples(x.data_evento) },
    { titulo: "Peso (kg)", valor: x => x.peso_kg },
    { titulo: "Volume (L)", valor: x => x.volume_litros },
    { titulo: "Observação", valor: x => x.observacao },
  ], todosEventos || []);
}

// ---------- Financeiro ----------
const CATEGORIAS_ENTRADA = ["Venda de Café", "Venda de Outros Produtos", "Outras Receitas"];
const CATEGORIAS_SAIDA = ["Insumos e Defensivos", "Mão de Obra", "Combustível", "Manutenção de Máquinas", "EPI e Segurança", "Energia e Água", "Impostos e Taxas", "Frete e Transporte", "Outras Despesas"];
const CATEGORIAS_FINANCEIRO = CATEGORIAS_ENTRADA.concat(CATEGORIAS_SAIDA);

async function renderFinanceiro(main) {
  const { data: lancamentos } = await sb.from("lancamentos_financeiros")
    .select("*")
    .order("data", { ascending: false })
    .limit(60);

  const hoje = new Date();
  const primeiroDiaMes = `${hoje.getFullYear()}-${String(hoje.getMonth() + 1).padStart(2, "0")}-01`;
  const proximoMes = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 1);
  const primeiroDiaProximoMes = `${proximoMes.getFullYear()}-${String(proximoMes.getMonth() + 1).padStart(2, "0")}-01`;

  const lancamentosDoMes = (lancamentos || []).filter(l => l.data >= primeiroDiaMes && l.data < primeiroDiaProximoMes);
  const totalEntradasMes = lancamentosDoMes.filter(l => l.tipo === "Entrada").reduce((s, l) => s + Number(l.valor || 0), 0);
  const totalSaidasMes = lancamentosDoMes.filter(l => l.tipo === "Saída").reduce((s, l) => s + Number(l.valor || 0), 0);
  const saldoMes = totalEntradasMes - totalSaidasMes;

  const despesasPorCategoria = CATEGORIAS_SAIDA.map(cat => ({
    categoria: cat,
    total: lancamentosDoMes.filter(l => l.tipo === "Saída" && l.categoria === cat).reduce((s, l) => s + Number(l.valor || 0), 0),
  })).filter(x => x.total > 0);

  const categoriaOptions = CATEGORIAS_FINANCEIRO.map(c => `<option value="${c}">${c}</option>`).join("");

  main.innerHTML = `
    <h2>Financeiro</h2>

    <div class="grid-resumo">
      <div class="stat-card">
        <div class="numero" style="color:var(--leaf);">R$ ${totalEntradasMes.toFixed(0)}</div>
        <div class="rotulo">Entradas do mês</div>
      </div>
      <div class="stat-card">
        <div class="numero" style="color:var(--cherry);">R$ ${totalSaidasMes.toFixed(0)}</div>
        <div class="rotulo">Saídas do mês</div>
      </div>
    </div>
    <div class="card" style="text-align:center;">
      <div class="title">Saldo do mês: <span style="color:${saldoMes >= 0 ? "var(--leaf)" : "var(--cherry)"};">R$ ${saldoMes.toFixed(2)}</span></div>
    </div>

    ${despesasPorCategoria.length ? `
      <div class="grafico-container">
        <canvas id="grafico-despesas"></canvas>
      </div>
    ` : ""}

    <form id="form-lancamento" style="margin-top:12px;">
      <label>Novo lançamento</label>
      <select name="tipo" id="select-tipo-lancamento" required>
        <option value="">Tipo...</option>
        <option value="Entrada">Entrada</option>
        <option value="Saída">Saída</option>
      </select>
      <select name="categoria" required>
        <option value="">Categoria...</option>
        ${categoriaOptions}
      </select>
      <label>Data</label>
      <input name="data" type="date" required />
      <label>Descrição</label>
      <input name="descricao" placeholder="Ex: Venda safra, adubo, diária..." />
      <label>Valor (R$)</label>
      <input name="valor" type="number" step="0.01" placeholder="0,00" required />
      <button type="submit">Registrar lançamento</button>
    </form>

    <div id="lista-financeiro"></div>
    <div id="relatorio-financeiro"></div>
  `;

  const dataInput = document.querySelector('#form-lancamento input[name="data"]');
  if (dataInput) dataInput.value = new Date().toISOString().slice(0, 10);

  // ---- Gráfico de despesas por categoria (mês atual) ----
  if (despesasPorCategoria.length) {
    const ctx = document.getElementById("grafico-despesas");
    if (graficoFinanceiro) { graficoFinanceiro.destroy(); graficoFinanceiro = null; }
    graficoFinanceiro = new Chart(ctx, {
      type: "bar",
      data: {
        labels: despesasPorCategoria.map(x => x.categoria),
        datasets: [{
          label: "Despesas do mês (R$)",
          data: despesasPorCategoria.map(x => x.total),
          backgroundColor: "#A8442F",
        }],
      },
      options: {
        indexAxis: "y",
        responsive: true,
        plugins: { legend: { display: false }, title: { display: true, text: "Despesas por categoria (mês atual)" } },
        scales: { x: { beginAtZero: true } },
      },
    });
  }

  document.getElementById("form-lancamento").onsubmit = async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    await sb.from("lancamentos_financeiros").insert({
      data: f.get("data"),
      tipo: f.get("tipo"),
      categoria: f.get("categoria"),
      descricao: f.get("descricao") || null,
      valor: f.get("valor"),
    });
    render();
  };

  const list = document.getElementById("lista-financeiro");
  if (!lancamentos || !lancamentos.length) {
    list.innerHTML = '<div class="empty">Nenhum lançamento registrado ainda.</div>';
    return;
  }
  const camposLancamento = ["data", "tipo", "categoria", "descricao", "valor"];
  list.innerHTML = lancamentos.map(l => {
    if (estaEditando("lancamentos_financeiros", l.id)) {
      return `
        <form class="form-edicao" data-table="lancamentos_financeiros" data-id="${l.id}" data-campos='${JSON.stringify(camposLancamento)}'>
          <select name="tipo" required>
            <option value="Entrada" ${l.tipo === "Entrada" ? "selected" : ""}>Entrada</option>
            <option value="Saída" ${l.tipo === "Saída" ? "selected" : ""}>Saída</option>
          </select>
          <select name="categoria" required>
            ${CATEGORIAS_FINANCEIRO.map(c => `<option value="${c}" ${c === l.categoria ? "selected" : ""}>${c}</option>`).join("")}
          </select>
          <label>Data</label>
          <input name="data" type="date" value="${l.data || ""}" required />
          <input name="descricao" placeholder="Descrição" value="${l.descricao || ""}" />
          <label>Valor (R$)</label>
          <input name="valor" type="number" step="0.01" value="${l.valor ?? ""}" required />
          <div class="row2">
            <button type="submit">Salvar</button>
            <button type="button" class="btn-secundario btn-cancelar-edicao">Cancelar</button>
          </div>
        </form>
      `;
    }
    const cor = l.tipo === "Entrada" ? "var(--leaf)" : "var(--cherry)";
    const sinal = l.tipo === "Entrada" ? "+" : "-";
    return `
    <div class="card">
      <div class="title">${l.categoria} <span style="color:${cor};font-weight:700;">${sinal} R$ ${Number(l.valor || 0).toFixed(2)}</span></div>
      ${l.descricao ? `<div class="nota">${l.descricao}</div>` : ""}
      <div class="meta">${fmtDataSimples(l.data)}</div>
      ${botoesAcao("lancamentos_financeiros", l.id)}
    </div>
  `;
  }).join("");
  ativarBotoesAcao(list, "Excluir este lançamento?");
  ativarFormEdicaoGenerico(list);

  montarBotoesRelatorio("relatorio-financeiro", "Relatório Financeiro", "financeiro", [
    { titulo: "Data", valor: x => fmtDataSimples(x.data) },
    { titulo: "Tipo", valor: x => x.tipo },
    { titulo: "Categoria", valor: x => x.categoria },
    { titulo: "Descrição", valor: x => x.descricao },
    { titulo: "Valor (R$)", valor: x => Number(x.valor || 0).toFixed(2) },
  ], lancamentos);
}

render();
</script>
</body>
</html>
